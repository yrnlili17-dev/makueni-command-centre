name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/route-level-rbac]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test API access policy
        run: node --experimental-strip-types --test artifacts/api-server/tests/api-access.test.mjs artifacts/commandcentre/tests/contact-summary.test.mjs artifacts/api-server/tests/registry-ward-filter.test.mjs artifacts/api-server/tests/iebc-history.test.mjs artifacts/api-server/tests/makueni-research.test.mjs artifacts/api-server/tests/makueni-monitoring-keywords.test.mjs
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.10.0 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck and build
        env:
          PORT: "3000"
          BASE_PATH: "/"
        run: pnpm run build



